name: uafinfra
channels:
  - conda-forge
dependencies:
  - python<3.11  # This is required to avoid "setting array with sequence error"
  - fastkml
  - ipython
  - obspy
  - numba
  - pip
  - pip:
    - git+https://github.com/uafgeotools/waveform_collection.git
    - git+https://github.com/uafgeotools/lts_array.git
    - -e .
